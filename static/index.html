<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Video Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=1.0.0" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand">
        <p class="brand-mark">Mini Video Agent</p>
        <p class="brand-line">用中文对话剪视频 · 本地隐私优先 · v1.0</p>
      </header>

      <section class="stage">
        <div class="player-panel">
          <section class="welcome-card">
            <strong>三步完成一次剪辑</strong>
            <span>上传视频 → 用中文描述 → 确认后导出</span>
            <div class="welcome-actions">
              <button type="button" class="quick-action" data-prompt="去掉前 3 秒">去掉片头 3 秒</button>
              <button type="button" class="quick-action" data-prompt="加标题：产品演示">加标题</button>
              <button type="button" class="quick-action" data-prompt="截第 5 秒看看">截帧预览</button>
            </div>
          </section>
          <div class="player-frame">
            <video id="player" controls playsinline></video>
            <div id="player-empty" class="player-empty">
              <p>上传短视频，或直接对话使用默认样本</p>
            </div>
          </div>
          <div class="player-actions">
            <label class="btn primary upload-btn">
              上传视频
              <input id="file-input" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.mov,.mkv,.webm" hidden />
            </label>
            <button id="btn-refresh" class="btn ghost" type="button">刷新预览</button>
            <button id="btn-history" class="btn ghost" type="button">对话记录</button>
            <button id="btn-reset" class="btn ghost" type="button">新对话</button>
          </div>
          <p id="media-meta" class="media-meta">尚未选择工作视频</p>
          <div class="outputs-block">
            <div class="section-label">
              成片列表 <span class="hint">点击播放</span>
              <button id="btn-open-folder" class="linkish" type="button">打开文件夹</button>
            </div>
            <p id="output-dir" class="path-line" title="成片目录"></p>
            <ul id="output-list" class="output-list">
              <li class="empty-hint">暂无导出成片</li>
            </ul>
          </div>
          <div class="section-label">截帧预览 <span class="hint">下方标注第几秒</span></div>
          <div id="preview-strip" class="preview-strip" hidden></div>
        </div>

        <aside class="chat-panel">
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="chat-form" class="composer">
            <textarea
              id="chat-input"
              rows="2"
              placeholder="例如：去掉前 3 秒 / 加标题：决赛高光 / 截第 1 秒看看"
              required
            ></textarea>
            <div class="composer-row">
              <div class="chips" id="chips">
                <button type="button" data-prompt="这个视频多长？">多长？</button>
                <button type="button" data-prompt="去掉前 3 秒">去片头</button>
                <button type="button" data-prompt="截第 1 秒看看">截帧</button>
                <button type="button" id="btn-retry" data-retry="1">重试上一条</button>
              </div>
              <button id="send-btn" class="btn primary" type="submit">发送</button>
            </div>
          </form>
        </aside>
      </section>
    </main>

    <div id="history-modal" class="modal" hidden aria-hidden="true">
      <div class="modal-backdrop" data-close-history></div>
      <div class="modal-card history-card" role="dialog" aria-labelledby="history-title">
        <div class="modal-head">
          <h2 id="history-title">对话记录</h2>
          <div class="modal-head-actions">
            <button type="button" class="btn ghost" id="btn-history-new">新对话</button>
            <button type="button" class="btn ghost" data-close-history>关闭</button>
          </div>
        </div>
        <p class="modal-note">按日期查看不同会话；间隔超过约 3 小时会自动开新会话。</p>
        <div class="history-layout">
          <aside id="session-nav" class="session-nav"></aside>
          <div id="history-list" class="history-list"></div>
        </div>
      </div>
    </div>

    <script src="/app.js?v=1.0.0"></script>
  </body>
</html>
