<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>灵剪 EditMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=2.0.0" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand">
        <p class="brand-mark">灵剪 <span>EditMate</span></p>
        <p class="brand-line">先预览再确认 · 配乐卡点与高光特效 · v2.0</p>
      </header>

      <section class="stage">
        <div class="player-panel">
          <div class="player-workspace">
          <aside class="welcome-card">
            <small class="welcome-kicker">AI 剪辑指南</small>
            <strong>不知道怎么剪？</strong>
            <span>把视频交给 AI 分析，它会结合语音、画面和时间点给出剪辑建议。</span>
            <div class="guide-lines">
              <span>① 先上传视频或选择已有成片</span>
              <span>② 点击“AI 教你怎么剪”</span>
              <span>③ 配音乐与特效，先看视频预览再确认</span>
            </div>
          </aside>
          <div class="player-main">
          <div class="player-frame">
            <video id="player" controls playsinline></video>
            <div id="player-empty" class="player-empty">
              <p>上传短视频，或直接对话使用默认样本</p>
            </div>
          </div>
          <section class="timeline-controls" aria-label="Video timeline controls">
            <div class="timeline-readout">
              <span id="current-time">00:00.000</span>
              <span class="timeline-separator">/</span>
              <span id="duration-time">00:00.000</span>
            </div>
            <input
              id="timeline-range"
              class="timeline-range"
              type="range"
              min="0"
              max="0"
              step="0.001"
              value="0"
              disabled
              aria-label="Seek video"
            />
            <div class="timeline-row">
              <div class="timeline-transport">
                <button id="btn-step-back" class="mini" type="button" title="后退一秒">-1秒</button>
                <button id="btn-play-pause" class="mini primary-mini" type="button" disabled>播放</button>
                <button id="btn-step-forward" class="mini" type="button" title="前进一秒">+1秒</button>
                <button id="btn-frame-back" class="mini" type="button" title="上一帧">上一帧</button>
                <button id="btn-frame-forward" class="mini" type="button" title="下一帧">下一帧</button>
              </div>
              <div class="time-jump">
                <label for="time-input">时间</label>
                <input id="time-input" type="text" inputmode="decimal" placeholder="00:00.000" disabled />
                <button id="btn-seek" class="mini" type="button" disabled>跳转</button>
              </div>
            </div>
            <div class="timeline-row timeline-mark-row">
              <div class="mark-actions">
                <button id="btn-set-in" class="mini" type="button" disabled>设为入点</button>
                <button id="btn-set-out" class="mini" type="button" disabled>设为出点</button>
                <button id="btn-clear-range" class="mini" type="button" disabled>清除范围</button>
              </div>
              <button id="btn-capture-frame" class="mini primary-mini" type="button" disabled>截取当前帧</button>
            </div>
            <p id="timeline-status" class="timeline-status" aria-live="polite">尚未加载视频</p>
          </section>
          <div class="player-actions">
            <label class="btn primary upload-btn">
              上传视频
              <input id="file-input" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.mov,.mkv,.webm" hidden />
            </label>
            <label class="btn ghost upload-btn">
              上传配乐
              <input id="music-file-input" type="file" accept="audio/mpeg,audio/wav,audio/mp4,audio/aac,audio/flac,audio/ogg,.mp3,.wav,.m4a,.aac,.flac,.ogg" hidden />
            </label>
            <button id="btn-refresh" class="btn ghost" type="button">刷新预览</button>
            <button id="btn-history" class="btn ghost" type="button">对话记录</button>
            <button id="btn-reset" class="btn ghost" type="button">新对话</button>
          </div>
          <p id="media-meta" class="media-meta">尚未选择工作视频</p>
          <div class="media-library-actions" aria-label="媒体管理">
            <button id="btn-open-outputs" class="media-library-btn" type="button">
              <span class="media-library-icon">▣</span>
              <span><strong>成片列表</strong><small>播放、使用、重命名或删除成片</small></span>
            </button>
            <button id="btn-open-previews" class="media-library-btn" type="button">
              <span class="media-library-icon">▧</span>
              <span><strong>截帧预览</strong><small>查看大图并管理时间点截图</small></span>
            </button>
          </div>
        </div>
        </div>
        </div>

        <aside class="chat-panel">
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="chat-form" class="composer">
            <textarea
              id="chat-input"
              rows="2"
              placeholder="例如：去掉前 3 秒 / 加标题：决赛高光 / 截第 1 秒看看"
              required
            ></textarea>
            <div class="composer-row">
              <div class="chips" id="chips">
                <button type="button" class="ai-chip" data-prompt="分析一下这个视频，告诉我怎么剪比较好">AI 教你怎么剪</button>
                <button type="button" data-prompt="这个视频多长？">多长？</button>
                <button type="button" data-prompt="去掉前 3 秒">去片头</button>
                <button type="button" data-prompt="给这个视频自动加字幕">自动字幕</button>
                <button type="button" data-prompt="去掉右下角水印">去水印</button>
                <button type="button" data-prompt="截第 1 秒看看">截帧</button>
                <button type="button" id="btn-retry" data-retry="1">重试上一条</button>
              </div>
              <button id="send-btn" class="btn primary" type="submit">发送</button>
            </div>
          </form>
        </aside>
      </section>
    </main>

    <div id="history-modal" class="modal" hidden aria-hidden="true">
      <div class="modal-backdrop" data-close-history></div>
      <div class="modal-card history-card" role="dialog" aria-labelledby="history-title">
        <div class="modal-head">
          <h2 id="history-title">对话记录</h2>
          <div class="modal-head-actions">
            <button type="button" class="btn ghost" id="btn-history-new">新对话</button>
            <button type="button" class="btn ghost" data-close-history>关闭</button>
          </div>
        </div>
        <p class="modal-note">按日期查看不同会话；间隔超过约 3 小时会自动开新会话。</p>
        <div class="history-layout">
          <aside id="session-nav" class="session-nav"></aside>
          <div id="history-list" class="history-list"></div>
        </div>
      </div>
    </div>

    <div id="media-modal" class="modal" hidden aria-hidden="true">
      <div class="modal-backdrop" data-close-media></div>
      <div class="modal-card media-card" role="dialog" aria-labelledby="media-title">
        <div class="modal-head">
          <div>
            <h2 id="media-title">媒体管理</h2>
            <p id="output-dir" class="path-line" title="成片目录"></p>
          </div>
          <div class="modal-head-actions">
            <button type="button" class="btn ghost" id="btn-open-folder">打开文件夹</button>
            <button type="button" class="btn ghost" data-close-media>关闭</button>
          </div>
        </div>
        <div class="media-modal-grid">
          <section class="media-manager-section" aria-labelledby="outputs-title">
            <div class="section-label" id="outputs-title">成片列表 <span class="hint">点击成片可播放</span></div>
            <div class="media-toolbar">
              <label><input id="output-select-all" type="checkbox" /> 全选</label>
              <button id="btn-delete-outputs" class="mini danger-mini" type="button">删除选中</button>
            </div>
            <ul id="output-list" class="output-list">
              <li class="empty-hint">暂无导出成片</li>
            </ul>
          </section>
          <section class="media-manager-section" aria-labelledby="previews-title">
            <div class="section-label" id="previews-title">截帧预览 <span class="hint">点击图片查看大图</span></div>
            <div class="media-toolbar">
              <label><input id="preview-select-all" type="checkbox" /> 全选</label>
              <button id="btn-delete-previews" class="mini danger-mini" type="button">删除选中</button>
            </div>
            <div id="preview-strip" class="preview-strip" hidden></div>
          </section>
        </div>
      </div>
    </div>

    <script src="/app.js?v=2.0.0-plan-return-mix"></script>
  </body>
</html>
